plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// The engine library comes from the repository's CMake Android configure, which the CMake
// output directory below is set to. Gradle does not run the native build itself, so a change
// to the engine needs `cmake --build build/android` before this packages it.

android {
    namespace = "net.opents.android"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    defaultConfig {
        applicationId "net.opents.android"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.2.0"

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['../../build/android/jniLibs']
            assets.srcDirs = ['../../build/android/assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        abortOnError = false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
